{% set name = "vsc-install" %}
{% set version = "0.21.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bc15330d8a9cb85378f02282145d760862b14b6d1ef2fe133c745515ec13b66f

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - mock
    - prospector >=0.12.1
    - pylint
    - python >={{ python_min }}
    - setuptools <42.0

test:
  imports:
    - vsc
    - vsc.install
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hpcugent/vsc-install
  summary: vsc-install provides shared setuptools functions and classes for python libraries developed by UGent's HPC group
  license: LGPL-2.0-or-later
  license_family: LGPL
  license_file: LICENSE

extra:
  recipe-maintainers:
    - anthchirp
    - boegel
    - jerowe
