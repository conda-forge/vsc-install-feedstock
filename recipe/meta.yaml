{% set name = "vsc-install" %}
{% set version = "0.22.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9d9e86fce4a72f6e46dd67cae42bd5b69bf38211ced93012f7cc3e264a7f5787

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
    - setuptools
  run:
    - mock
    - prospector >=0.12.1
    - pylint
    - python >=3.6
    - setuptools <42.0

test:
  imports:
    - vsc
    - vsc.install
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/hpcugent/vsc-install
  summary: vsc-install provides shared setuptools functions and classes for python libraries developed by UGent's HPC group
  license: LGPL-2.0-or-later
  license_family: LGPL
  license_file: LICENSE

extra:
  recipe-maintainers:
    - anthchirp
    - boegel
    - jerowe
